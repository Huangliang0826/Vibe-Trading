[project]
name = "alpha-mind"
version = "0.1.9"
description = "Alpha Mind — AI-driven personal quant research and trading assistant"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    {name = "Liang Huang", email = "huangliang19950826@gmail.com"},
]
keywords = ["finance", "trading", "backtesting", "agent", "swarm", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "langchain>=1.0.0,<2",
    "langchain-core>=1.0.0,<2",
    "langchain-openai>=1.0.0,<2",
    "langgraph>=1.0.10,<1.1",
    "langgraph-checkpoint>=2.1.0,<5",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "oauth-cli-kit>=0.1.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pypdfium2>=4.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "duckdb>=1.2.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "smartmoneyconcepts>=0.0.1",
    "pyharmonics>=1.5.0",
    "tushare>=1.2.89",
    "requests>=2.31.0",
    "yfinance>=0.2.30",
    "akshare>=1.12.0",
    "ccxt>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=1.6.0",
    "fastmcp>=2.0.0",
    "ddgs>=6.0.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "weasyprint>=60.0",
    "prompt_toolkit>=3.0.0",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git",
]

[tool.uv]
# mootdx (the `a-stock` extra) pins httpx>=0.25,<0.26 in its setup.py, but only
# uses forward-compatible httpx Client/get APIs; the core + fastmcp need
# httpx>=0.28. Override mootdx's stale upper cap so the lock stays resolvable and
# `uv sync --extra a-stock` installs mootdx against modern httpx — this encodes
# the manual `pip install 'httpx>=0.28.1'` step the mootdx skill already documents.
override-dependencies = [
    "httpx>=0.28.0",
    # TradingAgents 0.3.0 currently resolves langgraph-prebuilt newer than the
    # project-pinned langgraph 1.0.10; keep the pair aligned until langgraph 1.1
    # is adopted here.
    "langgraph-prebuilt==1.0.10",
]

[project.urls]
Repository = "https://github.com/Huangliang0826/Vibe-Trading"
Issues = "https://github.com/Huangliang0826/Vibe-Trading/issues"

[project.scripts]
alpha-mind = "cli:main"
alpha-mind-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "agent"}
py-modules = ["api_server", "mcp_server"]

[tool.setuptools.packages.find]
where = ["agent"]
include = ["src*", "backtest*", "cli*"]

[tool.setuptools.package-data]
"src" = [
    "skills/**/*.md",
    "skills/**/*.yaml",
    "skills/**/*.json",
    "providers/*.json",
    "swarm/presets/*.yaml",
    "shadow_account/templates/*.j2",
    "shadow_account/templates/*.html",
    "shadow_account/templates/*.css",
]
"backtest" = ["*.py"]
"src.factors" = ["zoo/**/*.yaml", "zoo/**/*.md", "zoo/**/NOTICE"]
"src.opportunity_center" = ["*.json", "*.md"]

[project.optional-dependencies]
ibkr = [
    "ib_async>=2.0",
]
deepseek = [
    "langchain-deepseek>=1.0.0,<2",
]
a-stock = [
    "mootdx>=0.11.7",
    "stockstats>=0.6.0",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-socket>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["agent"]
# importlib mode lets duplicate test basenames (test_routes.py, test_service.py,
# ...) coexist across subpackages without the legacy "prepend" collection clash.
addopts = "--import-mode=importlib"
markers = [
    "unit: Unit tests (fast, no network)",
    "integration: Integration tests (may need network)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["agent"]

[tool.coverage.run]
source = ["agent"]
omit = [
    "agent/tests/*",
    "agent/tests/**/*",
    "agent/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
exclude_also = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alpha zoo files import the full src.factors.base surface verbatim
# to match research-paper formulas. F401 (unused-import) is noise here;
# F841 (unused-local-variable) stays active to catch real formula bugs.
"agent/src/factors/zoo/**/*.py" = ["F401"]

# Alpha101 and GTJA191 zoo files follow research-paper formulas verbatim.
# Unused locals (adv5, dh1, o, etc.) match the original paper variables.
"agent/src/factors/zoo/alpha101/*.py" = ["F841"]
"agent/src/factors/zoo/gtja191/*.py" = ["F841", "E741"]
"agent/src/factors/zoo/qlib158/*.py" = ["F841"]

# Logger-before-import pattern is intentional in these modules.
"agent/src/session/events.py" = ["E402"]
"agent/src/session/search.py" = ["E402"]
"agent/src/session/service.py" = ["E402"]
"agent/src/research_analysis/tradingagents_adapter.py" = ["E402"]
"agent/api_server.py" = ["E402"]

# Agent module logger-before-import pattern.
"agent/src/agent/skills.py" = ["E402"]
"agent/src/agent/tools.py" = ["E402"]

# Test files that import from inside conditional blocks / after setup.
"agent/tests/test_shadow_account.py" = ["E402"]

# K线技术分析使用标准记法 l = low price
"agent/src/skills/candlestick/example_signal_engine.py" = ["E741"]
